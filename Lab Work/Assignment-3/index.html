<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment-3</title>
    <style>
       
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #6dd5fa, #2980b9);
            display: flex;
            flex-direction: column;
            color: #fff;
        }

       
        header {
            background: linear-gradient(to right, #ff9966, #ff5e62);
            padding: 20px;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

       
        main {
            flex: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

     
        .btncontainer {
            text-align: center;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(to right, #f8fe86, #f89d2e,rgb(255, 55, 0));
            border: none;
            color: white;
            padding: 12px 20px;
            font-size: 18px;
            font-weight:700;
            color:rgb(107, 14, 91);
            margin: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            background: linear-gradient(to right, #ff5e62, #ff9966);
        }

      
        #container {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            max-width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #3498db;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #dfe6e9;
        }

        footer {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 14px;
        }

       
        @media (max-width: 600px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }
            th {
                position: sticky;
                top: 0;
                z-index: 2;
            }
            td {
                border: none;
                display: flex;
                justify-content: space-between;
                padding: 10px;
                border-bottom: 1px solid #ddd;
            }
        }
    </style>
</head>
<body>
    
    
    <header>
        Assignment-3
    </header>

    <main>
        <div class="btncontainer">
            <button id="btn" onclick="getData()">Get data</button>
        </div>
        
        <div id="container">
            <table>
                <tr>
                    <th>User Id</th>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Completed</th>
                </tr>
                <tbody id="tbdy"></tbody>
            </table>
        </div>
    </main>

    
    <footer>
        &copy; 2025 JSON Data Viewer | Created by Vaibhav
    </footer>

    <script>
        function getData() {
            fetch("https://jsonplaceholder.typicode.com/todos")
            .then((response) => response.json())
            .then((data) => {
                let tbody = document.getElementById("tbdy");
                tbody.innerHTML = ""; 

                data.forEach(obj => {
                    let row = document.createElement("tr");
                    for (let k in obj) {
                        let d = document.createElement("td");
                        d.textContent = obj[k];
                        row.append(d);
                    }
                    tbody.append(row);
                });
            })
            .catch((err) => {
                console.log("error : " + err);
            })
        }
    </script>
</body>
</html>
